version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - KUBECONFIG=/root/.kube/config
      - CORS_ORIGIN=http://localhost:3000
      - METRICS_REFRESH_INTERVAL=5s
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    restart: unless-stopped
    networks:
      - k8s-dashboard

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - NGINX_BACKEND_URL=backend:8000
    volumes:
      # Runtime config (settings + /architecture content), like a ConfigMap would in-cluster.
      # Remove to use the default from frontend/public/config/config.yaml.
      - ./examples/config.example.yaml:/usr/share/nginx/html/config/config.yaml:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - k8s-dashboard

networks:
  k8s-dashboard:
    driver: bridge
