version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-backend:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-frontend:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
